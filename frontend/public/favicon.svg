<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Dark Rounded Canvas -->
  <rect width="100" height="100" rx="26" fill="#070812"/>

  <!-- Headphones headband arch -->
  <path d="M 18,50 C 18,24 32,12 50,12 C 68,12 82,24 82,50" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>

  <!-- Left ear cup -->
  <rect x="11" y="44" width="14" height="32" rx="7" fill="#FFFFFF"/>

  <!-- Right ear cup -->
  <rect x="75" y="44" width="14" height="32" rx="7" fill="#FFFFFF"/>

  <!-- Studio Condenser Microphone Capsule -->
  <rect x="38" y="26" width="24" height="40" rx="12" fill="#FFFFFF"/>

  <!-- 3 horizontal grille bars -->
  <rect x="44" y="38" width="12" height="2.8" rx="1.4" fill="#070812"/>
  <rect x="44" y="44" width="12" height="2.8" rx="1.4" fill="#070812"/>
  <rect x="44" y="50" width="12" height="2.8" rx="1.4" fill="#070812"/>

  <!-- Cradle U-bracket -->
  <path d="M 33,54 C 33,70 67,70 67,54" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>

  <!-- Cradle vertical stem -->
  <path d="M 50,69 L 50,78" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>

  <!-- Signature Pink Glowing Accent Dot -->
  <circle cx="50" cy="86" r="6.5" fill="#FF3D81"/>
</svg>

